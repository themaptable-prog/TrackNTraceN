<style>

.tabbar{display:flex;justify-content:space-between;align-items:center;margin:9px 0 7px}.tabs{display:flex;gap:16px}.tabs button{background:none;border:0;border-radius:0;padding:7px 0 5px;color:var(--muted);font-weight:750;font-size:12px;border-bottom:2px solid transparent}.tabs button[aria-pressed=true]{color:var(--orange);border-color:var(--orange)}.course-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.course-list button{min-height:32px;padding:4px 6px;text-align:left;color:var(--muted);font-size:11px;line-height:1.15;font-weight:700}.course-list button[aria-pressed=true]{color:var(--cream);background:#374b3e;border-color:#b6cc89}.course-list button small{color:var(--orange);font:700 9px var(--mono);margin-right:4px}.garage{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:clamp(10px,1.4vw,16px)}.garage h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

@media(max-width:680px){.layout{grid-template-columns:1fr}.course-hero{max-height:45vh}.course-hero canvas{max-height:45vh;object-fit:contain}.course-list{grid-template-columns:repeat(4,minmax(0,1fr))}.garage{margin-bottom:6px}.wordmark{font-size:clamp(28px,10vw,51px)}}

<body>
<main id="setup">
 <div class="wrap">
  <header class="masthead">
   <h1 class="wordmark">Track’n’<em>Trace’n</em></h1>
   <div class="mast-actions"><button class="icon" id="sound" aria-label="Mute audio" title="Mute audio">♫</button><button class="icon" id="full" aria-label="Fullscreen" title="Fullscreen">⛶</button></div>
  </header>
  <div class="layout">
   <section class="course-area" aria-label="Course selection">
    <div class="course-hero"><canvas id="preview" width="960" height="528" aria-hidden="true"></canvas>
     <div class="course-heading"><div><p id="course-kind"></p><h2 id="course-name"></h2></div><div class="pager"><button id="prev-course" aria-label="Previous course">‹</button><button id="next-course" aria-label="Next course">›</button></div></div>
    </div>
    <div class="tabbar"><div class="tabs"><button id="races-tab" aria-pressed="true">Race courses</button><button id="training-tab" aria-pressed="false">Training grounds</button></div></div>
    <div id="courses" class="course-list"></div>
   </section>
   <section class="garage" aria-label="Vehicle and race setup">
    <h2>Garage</h2>
    <div class="vehicle-preview"><button class="icon" id="prev-vehicle" aria-label="Previous vehicle">‹</button><canvas id="vehicle" width="360" height="130" aria-hidden="true"></canvas><button class="icon" id="next-vehicle" aria-label="Next vehicle">›</button></div>
    <div class="vehicle-name" id="vehicle-name"></div><div class="swatches" id="swatches" aria-label="Vehicle colour"></div>
    <div class="config">
     <div class="config-row" id="mode-row"><span class="label">Event</span><div class="segmented" id="event-select"><button data-value="race">Race</button><button data-value="damage">Damage challenge</button></div></div>
     <div class="config-row"><span class="label">Drag</span><div class="segmented" id="drag-select"><button data-value="trace">Draw path</button><button data-value="free">Free drag</button></div></div>
     <div class="config-row"><span class="label">Damage</span><div class="segmented" id="damage-select"><button data-value="on">On</button><button data-value="off">Off</button></div></div>
     <div class="config-row" id="lap-row"><span class="label">Laps</span><div class="segmented"><button id="less-laps" aria-label="Fewer laps">−</button><button id="laps-value" aria-label="Lap count, press to increase">3</button><button id="more-laps" aria-label="More laps">+</button></div></div>
     <div class="config-row" id="ghost-row"><label for="ghost-select">Ghost</label><select id="ghost-select" aria-label="Ghost"></select></div>
    </div>
    <div class="launch"><button id="start" class="primary">Start race</button><button id="records" class="secondary">Records</button></div>
    <p class="hint" id="hint"></p>
   </section>
  </div>
 </div>
</main>
<main id="play" hidden>
 <div id="stage">
  <canvas id="track" width="1800" height="990" aria-label="Race course"></canvas>
  <div class="hud">
   <div class="left-hud"><div class="hud-pill" id="lap-hud"></div><div id="splits" class="live-splits"></div></div>
   <div class="buttons"><div class="timers"><div class="hud-pill" id="time-hud"></div></div><button class="icon" id="pause" aria-label="Pause">Ⅱ</button></div>
  </div>
 </div>
 <div id="inspection" hidden><canvas id="inspect-car" width="660" height="460" aria-label="Enlarged vehicle, tap to return"></canvas></div>
 <div id="run-controls" hidden><div class="pause-tray">
  <button id="resume" class="primary">Resume</button>
  <button id="inspect">Inspect car</button>
  <button id="retry">Restart</button>
  <button id="quit">Exit</button>
  <div class="replay-bar" id="replay-controls" hidden><button id="replay-toggle" aria-label="Pause replay">Ⅱ</button><input id="seek" aria-label="Replay position" type="range" min="0" max="1000" value="0"><button id="replay-exit">Exit replay</button></div>
 </div></div>
 <div id="rotation" class="orientation" hidden><section><div class="rotate-icon" aria-hidden="true">↻</div><h2 id="rotation-title">Return to landscape</h2><p id="rotation-note">Restore the original orientation to resume.</p><button id="rotation-exit">Back to menu</button></section></div>
</main>
<div id="modal" class="modal-layer" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="dialog-header"><h2 id="modal-title"></h2><button id="close-modal" aria-label="Close">✕</button></div><div id="modal-body"></div></section></div>
<script>
'use strict';

const $ = id => document.getElementById(id);
const W = 1200, H = 660, TAU = Math.PI * 2;
const clamp = (v, low, high) => Math.max(low, Math.min(high, v));
const mix = (a, b, t) => a + (b - a) * t;
const mod = (v, n) => (v % n + n) % n;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const deltaAngle = (from, to) => mod(to - from + Math.PI, TAU) - Math.PI;
const hex = (color, amount) => {
  const value = parseInt(color.slice(1), 16);
  const toward = amount < 0 ? 0 : 255;
  return '#' + [value >> 16, (value >> 8) & 255, value & 255]
    .map(n => Math.round(mix(n, toward, Math.abs(amount))).toString(16).padStart(2, '0')).join('');
};
function random(seed) {
  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}
function rounded(ctx, x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}
function oval(ctx, x, y, rx, ry, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill();
}
function polygon(ctx, points, color) {
  if (!points.length) return;
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
function trackCanvas(draw, scale = 1) {
  const canvas = document.createElement('canvas');
  canvas.width = W * scale; canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale); draw(ctx);
  return canvas;
}

  const hint=options.drag==='trace'?'Draw ahead. A new touch replaces the path.':'Drag the vehicle directly around the course.';
  $('hint').textContent=training ? (options.damage?'Training ends with the first damage. ':'Exit whenever you like. ')+hint : hint;
  saveOptions();
}
function onSegment(id,change) {
  $(id).addEventListener('click',e=>{
    const target=e.target.closest('[data-value]');
    if(!target||target.disabled) return;
    change(target.dataset.value);renderSetup();
  });
}
function applyLap(delta,cycle=false) {
  options.laps=cycle?1+mod(options.laps-1+delta,10):clamp(options.laps+delta,1,10);
  renderSetup();
}
function fullscreen() {
  if(document.fullscreenElement||document.webkitFullscreenElement) return Promise.resolve();
  const el=document.documentElement, open=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!open) return Promise.resolve();
  try {return Promise.resolve(open.call(el,{navigationUI:'hide'})).catch(()=>{});} catch {return Promise.resolve();}
}
function orientationToken() {
  if(innerWidth<innerHeight) return null;
  const angle=screen.orientation?.angle ?? window.orientation ?? 0;
  return navigator.maxTouchPoints>0 ? 'landscape/'+angle : 'landscape';
}
function placeStage(game) {
  const token=orientationToken();
  if(!game.orientation&&token) {
    game.orientation=token;
    const scale=Math.min(innerWidth/W,innerHeight/H);
    $('stage').style.width=W*scale+'px';$('stage').style.height=H*scale+'px';
  }
  const invalid=!token||token!==game.orientation;
  if(invalid) {
    if(game.orientation) pauseGame();
    $('rotation-title').textContent=game.orientation?'Restore the original orientation':'Turn your tablet sideways';
    $('rotation-note').textContent=game.orientation?'Restore the original landscape orientation to resume.':'The course uses a fixed landscape view.';
  }
  $('rotation').hidden=!invalid;
  $('resume').disabled=invalid;
  $('stage').hidden=!game.orientation;
}
function showGame(game) {
  run=game;$('setup').hidden=true;$('play').hidden=false;
  $('inspection').hidden=true;
  placeStage(game);audio.begin(game.tune);
  updateHud(true);renderControls();drawScene(game);
}
async function settleFullscreen() {
  await Promise.race([fullscreen(),new Promise(resolve=>setTimeout(resolve,250))]);
}
function retainHighlights() {
  if(!run?.started||run.finished||run.replay||run.course.training||!run.impacts.length) return;
  saveFrame(run,true);saveRun(run,false,true);
}
async function newRace(config,ghost=null) {
  if(opening) return;
  opening=true;audio.unlock();
  await settleFullscreen();
  retainHighlights();closeModal();
  showGame(makeRun(config,ghost));opening=false;
}
function exitGame() {
  retainHighlights();
  if(run) stopPointer(run);
  run=null;$('play').hidden=true;$('setup').hidden=false;$('inspection').hidden=true;
  closeModal();renderSetup();
}
function stopPointer(game) {
  if(game.pointer!=null && $('track').hasPointerCapture(game.pointer)) {
    $('track').releasePointerCapture(game.pointer);
  }
  game.pointer=null;game.tip=null;game.fingers=[];
}
function pauseGame() {
  if(!run||run.finished||run.paused) return;
  run.paused=true;run.pausePulse=performance.now();run.frozenTip=run.tip;
  stopPointer(run);renderControls();
}
function resumeGame() {
  if(!run||run.finished||orientationToken()!==run.orientation) return;
  audio.unlock();run.paused=false;run.inspect=false;run.pausePulse=null;run.frozenTip=null;
  $('inspection').hidden=true;renderControls();
}
function renderControls() {
  if(!run) return;
  const replay=!!run.replay, pause=run.paused&&!run.finished;
  $('run-controls').hidden=!(pause||replay);
  $('resume').hidden=!pause;$('inspect').hidden=!pause;$('retry').hidden=!pause||replay;
  $('quit').hidden=!pause||replay;
  $('replay-controls').hidden=!replay||pause;
  $('pause').disabled=run.finished;
  $('inspect').textContent=run.inspect?'Close inspection':'Inspect car';
  $('replay-toggle').textContent=run.replayPlaying?'Ⅱ':run.elapsed>=run.replayHigh?'↺':'▶';
  $('replay-toggle').setAttribute('aria-label',run.replayPlaying?'Pause replay':run.elapsed>=run.replayHigh?'Replay again':'Play replay');
}
function inspectCar() {
  if(!run?.paused) return;
  run.inspect=!run.inspect;
  $('inspection').hidden=!run.inspect;
  if(run.inspect) {
    const canvas=$('inspect-car'), box=$('track').getBoundingClientRect(), c=canvas.getContext('2d');
    canvas.style.setProperty('--inspect-x',(box.left+box.width*run.car.x/W-innerWidth/2)+'px');
    canvas.style.setProperty('--inspect-y',(box.top+box.height*run.car.y/H-innerHeight/2)+'px');
    c.clearRect(0,0,660,460);
    rounded(c,10,10,640,440,28,'#25413f');
    rounded(c,22,22,616,416,21,'#36514a');
    const type=run.config.type;
    drawVehicle(c,330,230,run.car.a,type,run.color,run.car.damage,{scale:7.0});
  }
  renderControls();
}
function updateHud(force=false) {
  if(!run || (!force&&performance.now()-hudAt<37)) return;
  hudAt=performance.now();const game=run;
  const lap=Math.min(game.config.laps,game.splits.length+1);
  const remaining=Math.max(0,game.config.laps-game.splits.length);
  $('lap-hud').hidden=game.course.training;
  $('lap-hud').textContent='Lap '+lap+'/'+game.config.laps+' · '+remaining+' left';
  $('time-hud').textContent=clock(game.elapsed);
  const splitText=game.splits.map(x=>clock(x)).join('|');
  if(force||splitText!==displayed) {
    displayed=splitText;$('splits').replaceChildren();
    game.splits.forEach((s,i)=>{
      const block=document.createElement('span');block.className='hud-pill';
      block.textContent=(i+1)+' '+clock(s);$('splits').append(block);
    });
  }
  if(game.replay) {
    $('seek').value=Math.round(1000*(game.elapsed-game.replayLow)/Math.max(.001,game.replayHigh-game.replayLow));
  }
}
function openModal(kind,title,fill) {
  const modal=$('modal');
  if(modal.hidden) modalSource=document.activeElement;
  modalType=kind;$('modal-title').textContent=title;$('modal-body').replaceChildren();
  fill($('modal-body'));modal.hidden=false;
  $('setup').inert=true;$('play').inert=true;$('close-modal').focus({preventScroll:true});
}
function closeModal() {
  $('modal').hidden=true;modalType='';$('setup').inert=false;$('play').inert=false;
  if(modalSource?.offsetParent) modalSource.focus({preventScroll:true});
  modalSource=null;
}
function paragraph(text) {const e=document.createElement('p');e.textContent=text;return e;}
function stat(label,value) {
  const item=document.createElement('div'), name=document.createElement('small'), content=document.createElement('strong');
  name.textContent=label;content.textContent=value;item.append(name,content);return item;
}
function configLabel(c) {
  return vehicles[c.type].name+' · '+c.laps+(c.laps===1?' lap':' laps')+' · '+(c.drag==='trace'?'Draw path':'Free drag')+
    (c.damage?'':' · Damage off')+(c.mode==='damage'?' · Challenge':'');
}
function showRecords(courseIndex) {
  const entries=records.forCourse(courseIndex);
  openModal('records',courses[courseIndex].name+' records',body=>{
    if(!entries.length) {body.append(paragraph('Complete a race or make a hard impact to save a replay here.'));return;}
    const groups=[['Race times',['fast','clean']],['Damage challenge',['damage']],['Crash highlights',['crash']]];
    for(const [name,kinds] of groups) {
      const items=entries.filter(r=>kinds.includes(r.kind));
      if(!items.length) continue;
      const heading=document.createElement('h3');heading.textContent=name;body.append(heading);
      for(const [i,rec] of items.entries()) {
        const row=document.createElement('div'), label=document.createElement('div'), time=document.createElement('b'), meta=document.createElement('small');
        row.className='record';
        time.textContent=rec.kind==='crash'?'Crash '+(i+1)+' · '+rec.impact+' damage':
          rec.kind==='damage'?rec.score+' points':(rec.kind==='fast'?'Fastest · ':'Clean · ')+clock(rec.duration);
        meta.textContent=configLabel(rec.config);label.append(time,meta);
        const remove=button('Delete',()=>confirmDelete(rec,courseIndex),'delete');
        remove.setAttribute('aria-label','Delete '+time.textContent+' '+meta.textContent);
        row.append(label,button('Watch',()=>launchReplay(rec)),remove);body.append(row);
      }
    }
  });
}
function confirmDelete(record,course) {
  openModal('delete','Delete this result?',body=>{
    body.append(paragraph(configLabel(record.config)));
    const row=document.createElement('div');row.className='buttons';
    row.append(button('Keep',()=>showRecords(course)),button('Delete result',async()=>{
      const saved=await records.change([],[record.id]);
      if(saved) showRecords(course);
      else body.append(paragraph('This browser could not update the saved result.'));
    },'primary'));body.append(row);
  });
}
function finish(game,reason) {
  if(game.finished) return;
  game.finished=true;stopPointer(game);saveFrame(game,true);
  const completed=reason==='Finished', clean=completed&&!game.hits;
  const saved=game.course.training?null:saveRun(game,completed);
  const points=game.config.mode==='damage'?damageScore(game.car):
    completed?Math.round(10000/(1+game.elapsed/30))+(clean?1500:0):0;
  if(completed) audio.effect('finish');
  updateHud(true);renderControls();
  openModal('result',reason,body=>{
    const stats=document.createElement('div');stats.className='stats';
    stats.append(stat('Total time',clock(game.elapsed)));
    if(!game.course.training) {
      stats.append(stat('Laps completed',game.splits.length+'/'+game.config.laps),
        stat('Wall contacts',game.hits),stat(game.config.mode==='damage'?'Damage score':'Score',points));
      if(clean&&game.config.mode==='race') stats.append(stat('Clean bonus','+1,500'));
    }
    body.append(stats);
    const row=document.createElement('div');row.className='buttons';
    row.append(button('Run again',()=>newRace(game.config,game.ghost),'primary'),button('Back to menu',exitGame));
    if(!game.course.training) row.append(button('View records',()=>showRecords(game.config.course)));
    body.append(row);
    if(saved?.changes.some(r=>r.kind!=='crash')) {
      const labels={fast:'Fastest time',clean:'Fastest clean time',damage:'Damage high score'};
      body.append(paragraph(saved.changes.filter(r=>labels[r.kind]).map(r=>labels[r.kind]).join(' · ')));
    }
    saved?.saved.then(ok=>{if(!ok&&body.isConnected&&modalType==='result') body.append(paragraph('This browser could not save the replay to disk.'));});
  });
}
async function launchReplay(record) {
  if(opening) return;
  opening=true;audio.unlock();await settleFullscreen();closeModal();
  const game=makeRun(record.config);game.replay=record;game.tune=record.tune;
  game.replayLow=record.low??0;game.replayHigh=record.high??record.duration;
  game.elapsed=game.replayLow;game.replayPlaying=true;game.started=true;
  rebuildReplayTrail(game,game.elapsed);
  game.splits=record.splits.filter((_,i)=>record.splits.slice(0,i+1).reduce((a,b)=>a+b,0)<=game.elapsed+.001);
  showGame(game);opening=false;
}
function seekReplay(game,fraction) {
  game.elapsed=mix(game.replayLow,game.replayHigh,fraction);
  game.splits=game.replay.splits.filter((_,i)=>game.replay.splits.slice(0,i+1).reduce((a,b)=>a+b,0)<=game.elapsed+.001);
  rebuildReplayTrail(game,game.elapsed);updateHud(true);renderControls();
}

function inputPoint(e) {
  const box=$('track').getBoundingClientRect();
  return {x:clamp((e.clientX-box.left)*W/box.width,0,W),y:clamp((e.clientY-box.top)*H/box.height,0,H)};
}
$('track').addEventListener('pointerdown',e=>{
  const game=run;
  if(!game||game.finished||e.button!==0||!$('rotation').hidden) return;
  const pos=inputPoint(e);
  if(game.paused) {
    if(!game.inspect&&dist(pos,game.car)<55) inspectCar();
    return;
  }
  if(game.replay||game.pointer!=null) return;
  if(game.config.drag==='free') {
    const grabRadius=Math.max(31,29*W/$('track').getBoundingClientRect().width);
    if(dist(pos,game.car)>grabRadius) return;
    game.grab={x:game.car.x-pos.x,y:game.car.y-pos.y};
  }
  e.preventDefault();audio.unlock();
  game.pointer=e.pointerId;$('track').setPointerCapture(e.pointerId);
  game.tip=game.config.drag==='free'?{x:game.car.x,y:game.car.y}:pos;
  if(!game.started) {game.started=true;if(!game.course.training) saveFrame(game,true);}
  if(game.config.drag==='trace') {
    game.route=[];appendRoute(game,pos);
  } else game.fingers=[game.tip];
  audio.effect('rev',.8);
});
$('track').addEventListener('pointermove',e=>{
  const game=run;
  if(!game||game.pointer!==e.pointerId||game.paused) return;
  const chain=e.getCoalescedEvents?.()||[];
  const movements=chain.length?chain:[e];
  for(const event of movements) {
    const p=inputPoint(event);
    if(game.config.drag==='free') {
      p.x=clamp(p.x+game.grab.x,0,W);p.y=clamp(p.y+game.grab.y,0,H);
      game.fingers.push(p);
    } else appendRoute(game,p);
    game.tip=p;
  }
});
for(const name of ['pointerup','pointercancel','lostpointercapture']) {
  $('track').addEventListener(name,e=>{
    if(!run||run.pointer!==e.pointerId) return;
    run.pointer=null;run.tip=null;
    if(name!=='pointerup') run.fingers=[];
  });
}
$('start').addEventListener('click',()=>{
  const config=configNow(), ghost=records.matching(config,$('ghost-select').value);
  newRace(config,options.mode==='race'?ghost:null);
});
$('records').addEventListener('click',()=>showRecords(options.course));
$('ghost-select').addEventListener('change',e=>{options.ghost=e.target.value;saveOptions();});
$('races-tab').addEventListener('click',()=>{training=false;setCourse(raceCourse);});
$('training-tab').addEventListener('click',()=>{training=true;setCourse(trainingCourse);});
$('prev-course').addEventListener('click',()=>changeCourse(-1));$('next-course').addEventListener('click',()=>changeCourse(1));
$('prev-vehicle').addEventListener('click',()=>{options.type=mod(options.type-1,4);renderSetup();});
$('next-vehicle').addEventListener('click',()=>{options.type=mod(options.type+1,4);renderSetup();});
onSegment('event-select',value=>{options.mode=value;});
onSegment('drag-select',value=>{options.drag=value;});
onSegment('damage-select',value=>{options.damage=value==='on';if(!options.damage) options.mode='race';});
$('less-laps').addEventListener('click',()=>applyLap(-1));
$('more-laps').addEventListener('click',()=>applyLap(1));
$('laps-value').addEventListener('click',()=>applyLap(1,true));
$('sound').addEventListener('click',()=>{audio.unlock();audio.mute(!audio.muted);renderSetup();});
$('full').addEventListener('click',()=>{audio.unlock();fullscreen();});
$('pause').addEventListener('click',()=>run?.paused?resumeGame():pauseGame());
$('resume').addEventListener('click',resumeGame);
$('inspect').addEventListener('click',inspectCar);$('inspect-car').addEventListener('click',inspectCar);
$('quit').addEventListener('click',exitGame);$('rotation-exit').addEventListener('click',exitGame);
$('retry').addEventListener('click',()=>run&&newRace(run.config,run.ghost));
$('replay-exit').addEventListener('click',()=>{
  const index=run?.config.course;exitGame();if(index!=null) showRecords(index);
});
$('replay-toggle').addEventListener('click',()=>{
  if(!run?.replay) return;
  audio.unlock();
  if(run.elapsed>=run.replayHigh) seekReplay(run,0);
  run.replayPlaying=!run.replayPlaying;renderControls();
});
$('seek').addEventListener('input',e=>{
  if(run?.replay) {run.replayPlaying=false;seekReplay(run,Number(e.target.value)/1000);}
});
$('close-modal').addEventListener('click',()=>{if(run?.finished) exitGame();else closeModal();});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape') {
    if(!$('modal').hidden) {if(run?.finished) exitGame();else closeModal();}
    else if(run) {if(run.paused) resumeGame();else pauseGame();}
  }
});
const windowChanged=()=>{if(run&&!run.finished) placeStage(run);};
window.addEventListener('resize',windowChanged);
window.addEventListener('orientationchange',windowChanged);
document.addEventListener('fullscreenchange',windowChanged);
screen.orientation?.addEventListener('change',windowChanged);
document.addEventListener('visibilitychange',()=>{if(document.hidden) pauseGame();});

let lastTick=performance.now();
function animate(now) {
  const duration=clamp((now-lastTick)/1000,0,.23);lastTick=now;
  if(run) {
    const steps=Math.max(1,Math.ceil(duration/.0125)), dt=duration/steps;
    if(dt>0&&!run.paused&&!run.finished&&$('rotation').hidden) {
      for(let i=0;i<steps;i++) {
        if(run.replay) tickReplay(run,dt);else tickRace(run,dt);
      }
    }
    if(!$('stage').hidden) drawScene(run);
    updateHud();
    const playing=run.started&&!run.paused&&!run.finished&&$('rotation').hidden&&(!run.replay||run.replayPlaying);
    audio.tick(playing,timedIntensity(run),run.car.speed,run.config.type,
      run.pointer!=null||run.car.speed>17);
  } else audio.tick(false,false,0,0,false);
  requestAnimationFrame(animate);
}
renderSetup();
records.ready.then(()=>{if(!run) renderSetup();});
requestAnimationFrame(animate);

</script>
