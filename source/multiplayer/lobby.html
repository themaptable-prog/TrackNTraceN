<main id="multiplayer" hidden>
 <header class="net-header"><button id="net-back">Back to menu</button><h1>Multiplayer</h1><button id="net-leave" hidden>Leave room</button></header>
 <p id="net-status" role="status" aria-live="polite"></p>
 <section id="net-entry" class="net-panel">
  <h2>Same Wi-Fi</h2>
  <div class="net-buttons"><button id="net-host-direct" class="primary">Host direct</button><button id="net-join-direct">Join direct</button></div>
  <p>Direct pairing uses two QR scans. Connect up to three guests on the same Wi-Fi.</p>
  <h2>Laptop host</h2><p>Start the LAN host on the laptop. Guests can scan its QR with their device’s Camera app to open the lobby.</p>
  <button id="net-reopen-lan" hidden>Open laptop lobby</button>
 </section>
 <section id="net-pair" class="net-panel" hidden>
  <div class="net-lobby-head"><h2 id="net-pair-title"></h2><button id="net-hide-pair" hidden>Hide invite</button></div><p id="net-pair-help"></p>
  <div id="net-qr-wrap" hidden>
   <canvas id="net-qr" role="img" aria-label="Multiplayer pairing QR"></canvas>
   <a id="net-lan-link" hidden></a>
   <label class="net-address" id="net-address-row" hidden>Network address <select id="net-address"></select></label>
   <details><summary>Copy code or link</summary><textarea id="net-code-out" readonly rows="3" aria-label="Pairing code"></textarea><button id="net-copy">Copy</button></details>
  </div>
  <div id="net-code-entry" hidden>
   <div class="net-buttons"><button id="net-camera">Scan QR with camera</button><label class="net-file">Read QR photo<input type="file" id="net-image" accept="image/*"></label></div>
   <video id="net-video" playsinline muted hidden></video><canvas id="net-scan-canvas" hidden></canvas>
   <details><summary>Paste pairing code</summary><textarea id="net-code" rows="3" placeholder="TNT-…" aria-label="Paste pairing code"></textarea><button id="net-scan-code">Use code</button></details>
  </div>
 </section>
 <section id="net-lobby" class="net-panel" hidden>
  <div class="net-lobby-head"><h2>Lobby</h2><button id="net-invite" hidden>Show invite QR</button></div>
  <ul id="net-roster" aria-label="Players"></ul>
  <div class="net-fields">
   <label>Driver name<input id="net-name" maxlength="22" autocomplete="nickname"></label>
   <label>Vehicle<select id="net-vehicle"></select></label>
   <label>Paint<select id="net-paint"></select></label>
  </div>
  <h2>Course and rules</h2><p id="net-turn"></p>
  <div class="net-fields">
   <label>Course<select id="net-course"></select></label>
   <label id="net-laps-row">Laps<select id="net-laps"></select></label>
   <label>Event<select id="net-event"><option value="race">Race</option><option value="one-hit">One Hit Loss</option><option value="damage">Damage challenge</option></select></label>
   <label>Damage<select id="net-damage"><option value="off">Off</option><option value="open">Damage only</option><option value="total">Can total</option></select></label>
   <label>Steering<select id="net-steer"><option value="trace">Draw path</option><option value="free">Free drag</option></select></label>
   <label id="net-hazards-row">Track hazards<select id="net-hazards"><option value="off">Off</option><option value="on">On</option></select></label>
   <label>Soundtrack<select id="net-music"></select></label>
  </div>
  <div class="net-buttons"><button id="net-ready-button" class="primary">Ready</button><button id="net-start" class="primary" hidden>Start race</button></div>
 </section>
</main>
